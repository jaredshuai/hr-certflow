# hr-certflow shared-k3s v1 onboarding request.
# This is an infra input document, not an application manifest to apply directly.
project:
  id: hr-certflow
  repo: https://github.com/jaredshuai/hr-certflow.git
  namespaces:
    dev: hr-certflow-dev
    release: hr-certflow-release
  urls:
    dev: http://10.34.200.180/hr-certflow-dev/
    release: http://10.34.200.180/hr-certflow/

runtime:
  backend:
    framework: FastAPI
    port: 8000
    # jxccs-access protects /api/v1/health with a business session.
    # Probes and cluster-internal smoke use the exact kubelet bypass endpoint.
    healthPath: /_internal/healthz
  frontend:
    framework: Umi Max / Ant Design Pro
    port: 80
  worker: Celery worker
  scheduler: Celery Beat

dependencies:
  data:
    - PostgreSQL dev/release database and user
    - Per-environment standalone Redis broker/result backend credentials injected through runtime secrets, with Celery queue/prefix isolation
    - Alibaba Cloud OSS bucket/prefix through the S3-compatible API
  external:
    - Shared Dify workflow-center endpoint and API key
    - WeCom/Feishu/DingTalk webhook or SMTP
  identity:
    # dev only (jxccs-access step 3). Egress is infra-owned NetworkPolicy
    # hr-certflow-dev/allow-authorization-center-dev; this repo declares the need only.
    manifest: authz/authorization-manifest.json
    dev:
      - Authorization Center runtime decision API (authorization-center-dev runtime pods, TCP 8080)
      - Hydra OIDC issuer http://10.34.200.180/hydra-dev, reached via the Traefik ingress address (api pod egress to the Traefik pod, TCP 8000, because kube-proxy DNATs the external IP)
      - Redis-backed jxccs-access sessions via SESSION_STORE_URL from hr-certflow-runtime-secrets (Redis database 1)

infraToProvision:
  secrets:
    - hr-certflow-runtime-secrets
    - ghcr-pull-secret
  appProject:
    allowedRepo: https://github.com/jaredshuai/hr-certflow.git
    allowedNamespaces:
      - hr-certflow-dev
      - hr-certflow-release
  kubeconfigs:
    - namespace-scoped observer kubeconfig
    - namespace-scoped deployer/bootstrap kubeconfig if platform approves bootstrap flow
  releaseAutomation:
    desiredState: automated release rollout after GitOps values promotion
    requirement: enable automated sync on the hr-certflow-release Argo CD Application, or grant the workflow a narrow audited sync capability for only that Application
    guardrails:
      - release workflow must not receive plaintext runtime secrets
      - release smoke must pass on web, API health, and Celery/Redis before the promotion is accepted
      - rollback must use the existing-image promotion workflow with operation=rollback

runtimeSecretKeys:
  - DATABASE_URL
  - REDIS_URL
  - CELERY_BROKER_URL
  - CELERY_RESULT_BACKEND
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
  - DIFY_API_KEY
  - WECOM_WEBHOOK_URL
  - FEISHU_WEBHOOK_URL
  - DINGTALK_WEBHOOK_URL
  - SMTP_USERNAME
  - SMTP_PASSWORD
  # #33 第 3 步（jxccs-access）：目前仅 dev 需要；值由 infra 写入，仓库不存值。
  - AUTHZ_SERVICE_TOKEN
  - OIDC_CLIENT_SECRET
  # Credential-bearing session-store URL; declare it here, never in configMapKeys.
  - SESSION_STORE_URL

configMapKeys:
  - APP_NAME
  - APP_ENV
  - APP_TIMEZONE
  - AUTO_CREATE_TABLES
  - API_CORS_ORIGINS
  - CELERY_NAMESPACE
  - CELERY_QUEUE
  - CELERY_ROUTING_KEY
  - CELERY_REDIS_HASH_TAG
  - CELERY_REDIS_PREFIX
  - S3_ENDPOINT_URL
  - S3_REGION
  - S3_BUCKET
  - S3_FORCE_PATH_STYLE
  - AWS_REQUEST_CHECKSUM_CALCULATION
  - AWS_RESPONSE_CHECKSUM_VALIDATION
  - UPLOAD_PREFIX
  - DIFY_BASE_URL
  - DIFY_WORKFLOW_ID
  - NOTIFICATION_HR_RECIPIENTS
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_STARTTLS
  # #33 第 3 步（jxccs-access）：目前仅 dev values 设置。
  - APP_ID
  - PUBLIC_BASE_URL
  - OIDC_ISSUER_URL
  - OIDC_ISSUER_KEY
  - OIDC_CLIENT_ID
  - AUTHZ_BASE_URL
  - SESSION_IDLE_SECONDS
  - SESSION_ABSOLUTE_SECONDS
  - SESSION_CHECK_INTERVAL_SECONDS
  - POD_NAMESPACE
  - MAIL_FROM

smoke:
  dev:
    web: http://10.34.200.180/hr-certflow-dev/
    # /api/v1/health requires a business session when jxccs-access is enabled.
    # The deployed workflow probes this path through the Kubernetes API proxy.
    apiProbe:
      path: /_internal/healthz
      mode: cluster-internal
    celeryRedis:
      envFrom:
        - secret: hr-certflow-runtime-secrets
        - configMap: hr-certflow-config
      commands:
        - python -m app.smoke.celery_redis_isolation selftest
        - python -m app.smoke.celery_redis_isolation send
        - python -m app.smoke.celery_redis_isolation assert-keys
  release:
    web: http://10.34.200.180/hr-certflow/
    apiProbe:
      path: /_internal/healthz
      mode: cluster-internal
    celeryRedis:
      envFrom:
        - secret: hr-certflow-runtime-secrets
        - configMap: hr-certflow-config
      commands:
        - python -m app.smoke.celery_redis_isolation selftest
        - python -m app.smoke.celery_redis_isolation send
        - python -m app.smoke.celery_redis_isolation assert-keys
