{{- if .Values.glitchtip.enabled }}
# GlitchTip 前端监控的运行时注入配置。公仓 values 里 dsn 恒为空/关闭；
# 启用时由部署侧私有 values overlay 注入真实 DSN（含内网地址，绝不进公仓）。
# 内容以 subPath 覆盖 web 镜像内的 glitchtip-config.js 占位文件。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hr-certflow.fullname" . }}-web-glitchtip
  labels:
    {{- include "hr-certflow.labels" . | nindent 4 }}
data:
  glitchtip-config.js: |
    window.__GLITCHTIP_CONFIG__ = {
      dsn: {{ .Values.glitchtip.dsn | default "" | quote }},
      {{- if .Values.glitchtip.environment }}
      environment: {{ .Values.glitchtip.environment | quote }},
      {{- end }}
      {{- if .Values.glitchtip.release }}
      release: {{ .Values.glitchtip.release | quote }},
      {{- end }}
    };
{{- end }}
