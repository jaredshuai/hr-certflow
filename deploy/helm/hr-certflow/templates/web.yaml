apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hr-certflow.fullname" . }}-web
  labels:
    {{- include "hr-certflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ include "hr-certflow.intOrPercent" .Values.web.strategy.maxSurge }}
      maxUnavailable: {{ include "hr-certflow.intOrPercent" .Values.web.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "hr-certflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "hr-certflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if .Values.glitchtip.enabled }}
          volumeMounts:
            - name: glitchtip-config
              # subPath 只覆盖这一个文件，镜像内其余静态资源不受影响；
              # nginx 已对该路径返回 no-store，更新 ConfigMap 后浏览器即取新值。
              mountPath: /usr/share/nginx/html/glitchtip-config.js
              subPath: glitchtip-config.js
              readOnly: true
          {{- end }}
      {{- if .Values.glitchtip.enabled }}
      volumes:
        - name: glitchtip-config
          configMap:
            name: {{ include "hr-certflow.fullname" . }}-web-glitchtip
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hr-certflow.fullname" . }}-web
  labels:
    {{- include "hr-certflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "hr-certflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
