nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-pull-secret

runtimeSecretName: hr-certflow-runtime-secrets

config:
  APP_NAME: HR CertFlow
  APP_ENV: dev
  APP_TIMEZONE: Asia/Shanghai
  AUTO_CREATE_TABLES: "false"
  API_CORS_ORIGINS: http://10.34.200.180
  CELERY_NAMESPACE: hr-certflow-dev
  CELERY_QUEUE: hr-certflow-dev
  CELERY_ROUTING_KEY: hr-certflow-dev
  CELERY_REDIS_HASH_TAG: hr-certflow-dev
  CELERY_REDIS_PREFIX: "hr-certflow-dev:"
  S3_ENDPOINT_URL: https://oss-cn-hangzhou.aliyuncs.com
  S3_REGION: cn-hangzhou
  S3_BUCKET: jxccs-shared-infra-oss-cn-hangzhou
  S3_FORCE_PATH_STYLE: "false"
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  UPLOAD_PREFIX: hr-certflow/dev/certificates
  DIFY_BASE_URL: ""
  DIFY_WORKFLOW_ID: certificate-extraction
  NOTIFICATION_HR_RECIPIENTS: ""
  SMTP_STARTTLS: "true"

images:
  api:
    repository: ghcr.io/jaredshuai/hr-certflow-api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/jaredshuai/hr-certflow-web
    tag: latest
    pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8000
  strategy:
    maxSurge: 0
    maxUnavailable: 1
  # Kubernetes 探针路径。默认指向 /_internal/healthz —— 该端点精确绕过
  # AUTH_REQUIRED 校验,使 kubelet probe 无 X-HR-Actor 也能通过。
  # 不要改回 /api/v1/health:release 下该端点受 AUTH_REQUIRED 保护,
  # 无 actor 会 401 导致 Pod 不 Ready。
  probes:
    path: /_internal/healthz
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicas: 1
  port: 80
  strategy:
    maxSurge: 0
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  replicas: 1
  concurrency: 2
  strategy:
    maxSurge: 0
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

beat:
  replicas: 1
  strategy:
    maxSurge: 0
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

migrations:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# GlitchTip 前端错误监控（公仓默认关闭）。
# 启用时由部署侧私有 values overlay 覆盖：glitchtip.enabled=true 并提供真实
# dsn（内网地址绝不进公仓）；chart 据此生成 ConfigMap 并以 subPath 覆盖 web
# 镜像内的 glitchtip-config.js 占位文件。environment/release 可选，
# 缺省时前端按应用前缀自动推断 dev/release。
glitchtip:
  enabled: false
  dsn: ""
  environment: ""
  release: ""

ingress:
  enabled: true
  className: traefik
  host: ""
  pathPrefix: /hr-certflow-dev
  # 为 true 时追加 <pathPrefix>/auth → api（jxccs-access 的 /auth/* 路由）。dev 与 release 均开启。
  authPath: false
  annotations: {}
