config:
  APP_ENV: release
  AUTH_REQUIRED: "true"
  # 过渡值：直连 API 的 Traefik 在 k3s Pod 网段内；#33 第 3 步接入 BFF SDK 后删除。
  TRUSTED_PROXY_CIDRS: 10.42.0.0/16
  AUTO_CREATE_TABLES: 'false'
  API_CORS_ORIGINS: http://10.34.200.180
  CELERY_NAMESPACE: hr-certflow-release
  CELERY_QUEUE: hr-certflow-release
  CELERY_ROUTING_KEY: hr-certflow-release
  CELERY_REDIS_HASH_TAG: hr-certflow-release
  CELERY_REDIS_PREFIX: 'hr-certflow-release:'
  S3_ENDPOINT_URL: https://oss-cn-hangzhou.aliyuncs.com
  S3_REGION: cn-hangzhou
  S3_BUCKET: jxccs-shared-infra-oss-cn-hangzhou
  S3_FORCE_PATH_STYLE: 'false'
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  UPLOAD_PREFIX: hr-certflow/release/certificates
images:
  api:
    repository: ghcr.io/jaredshuai/hr-certflow-api
    tag: ee42f3445f3b
  web:
    repository: ghcr.io/jaredshuai/hr-certflow-web
    tag: ee42f3445f3b
ingress:
  pathPrefix: /hr-certflow
api:
  replicas: 2
web:
  replicas: 2
worker:
  replicas: 1
beat:
  replicas: 1
