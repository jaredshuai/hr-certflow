# 变异测试配置（lazypack-discipline `mutation-testing` 配方，工具固定 mutmut 2.x）。
#
# mutmut 2.x 只读取「当前目录」的 pyproject.toml [tool.mutmut] 或 setup.cfg
# [mutmut]，所以本文件必须在仓库根，`mutmut run` 也必须从仓库根运行：这样
# .mutmut-cache 里的源文件路径、统一报告与补测 issue 标题里的 file 字段才是
# 「仓库根相对路径」。
#
# 首轮试点范围（249 个变异体，jxccs 实测单次约 4.5 分钟；扩面时改
# paths_to_mutate 并同步 pytest-mutation.ini 的 testpaths）：
#   backend/app/services/audit.py           审计载荷脱敏与审计写入
#   backend/app/services/notifications.py   Webhook URL 脱敏、渠道分派与投递原因码
#
# 暂不纳入及原因（均为首轮实测结论，详见 docs/mutation-testing.md）：
#   - backend/app/api/deps.py（请求上下文：可信代理、请求 ID、操作人）：73 个
#     变异体里 4 个只有慢用例 test_access_wiring / test_trusted_proxy 才能杀死，
#     而把这两个文件放进 runner 会让每个存活变异体多花约 6 秒。要么连这两个
#     慢用例一起纳入并接受更长预算，要么等 coverage 用例选择，不单独放进来；
#   - backend/app/api/access.py：守护用例 test_access_wiring 单文件约 5 秒；
#   - backend/app/core/config.py：pydantic 字段默认值产生大量配置层噪声（配置层
#     按配方运营手册属于结构性豁免）；
#   - backend/app/services/certificates.py（证书状态）：核心用例需要 DATABASE_URL，
#     纯单元环境下会 skip，直接跑会把「没连库」误报成存活。
#
# 运行（mutmut 装在 backend 的 uv 虚拟环境里，见 pyproject 的 mutation extra）：
#   uv sync --project backend --extra dev --extra mutation --locked
#   PATH="$PWD/backend/.venv/bin:$PATH" mutmut run
# 一条龙（实跑 -> 解析 -> 基线 -> 补测 issue，零 gh 调用的预览模式）。必须先删
# 缓存：结果全部命中缓存时 mutmut 不重写 .mutmut-cache，runner 脚本会把它误判
# 成陈旧缓存并以退出码 2 失败：
#   rm -f .mutmut-cache && PATH="$PWD/backend/.venv/bin:$PATH" \
#     scripts/nightly-mutation-runner.sh --lang py --dry-run
#
# 注意（均为 mutmut 2.5.1 实测行为）：
#   - 下面三个值必须写成单行：ConfigParser 把续行原样保留成换行符，而
#     paths_to_mutate 不做 strip（带换行的路径被当成不存在而静默丢弃），runner
#     则原样交给 shell=True（换行会被当成命令分隔符）；
#   - paths_to_mutate 里不存在的路径会被静默丢弃（全部不存在才报错），扩面后用
#     `mutmut results` 或统一报告核对实际文件清单；
#   - 改动 runner / 范围后先删除 .mutmut-cache 再跑：结果缓存与基线耗时只按
#     测试文件内容取 hash，只改 runner 不会让旧结果失效；
#   - 配置文件只在选项取值为假时才生效：test_time_multiplier（默认 2.0）写在配置
#     文件里会被忽略；test_time_base（默认 0.0）在 setup.cfg 里会拿到字符串，
#     出现被杀死的变异体时直接 TypeError，所以这里不配任何数值选项。
[mutmut]
paths_to_mutate=backend/app/services/audit.py,backend/app/services/notifications.py
tests_dir=backend/tests/
runner=python -m pytest -c pytest-mutation.ini
