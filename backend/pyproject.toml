[project]
name = "hr-certflow-backend"
version = "0.1.0"
description = "FastAPI backend for HR certificate workflow management"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "boto3>=1.43.4",
    "celery[redis]>=5.6.3",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "jxccs-access[redis]",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.5.2",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.12",
    "redis>=5.1.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

# #33 第 3 步：一步接入包以 vendor 快照引入（来源 commit 见各目录 VENDOR-SOURCE.txt）。
# jxccs-authz-client 的来源由 vendor/jxccs-access/pyproject.toml 自带的
# `../authorization-client-python` path source 决定（uv 会采用依赖自带的 sources），
# 故目录布局与源仓库一致、不改上游 pyproject。镜像构建用 --no-editable 安装。
# 传递依赖版本由 uv.lock 钉住。
[tool.uv.sources]
jxccs-access = { path = "vendor/jxccs-access" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.6.9",
    "ty>=0.0.34",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
