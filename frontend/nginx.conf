server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # GlitchTip 运行时注入的配置文件（部署侧用 ConfigMap subPath 覆盖）。
  # 精确匹配不被 SPA fallback 劫持；no-store 保证覆盖挂载后浏览器立刻拿到新配置。
  location = /glitchtip-config.js {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
