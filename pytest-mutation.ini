# 变异测试专用的 pytest 选择配置。
#
# 只被同目录 setup.cfg 的 [mutmut] runner 以 `-c` 引用，并且必须从仓库根目录
# 运行（pytest 只在「调用目录 == rootdir」时才采用 testpaths）。日常 pytest /
# CI 不带 -c，只认 pytest.ini / [tool.pytest.ini_options] / [tool:pytest]，不会
# 读到本文件。
#
# 这里是 setup.cfg 试点范围的「守护用例集」：每个变异体都起一次 pytest 跑它，
# -x 在首个失败处停。为什么不直接跑整个 backend/tests：
#   - helm 渲染用例（test_glitchtip_helm_rendering）依赖 helm CLI，且只验证
#     deploy/ 产物，与被变异的 Python 模块无关；
#   - 纯数据库集成用例（test_lifecycle_guards / test_review_workflows /
#     test_operator_source）没有 DATABASE_URL 时整体 skip，首轮试点不纳入；
#   - test_access_wiring 与 test_trusted_proxy 很慢（单文件约 5 秒 / 2 秒，会
#     构建完整 FastAPI 应用），而且对审计脱敏、通知这两个模块的变异体没有
#     任何额外杀伤（首轮实测：纳入与否的逐个变异体结果完全一致），所以不纳入；
#     以后把 backend/app/api/deps.py 或 access.py 放进变异范围时必须把它们加回来。
#
# testpaths 的顺序就是执行顺序：直接命中试点模块的用例排在最前，被杀死的
# 变异体就能尽早停下；只有存活到最后的变异体才会付完整一轮的时间。
#
# 首轮试点范围（与 setup.cfg 的 paths_to_mutate 对应）：
#   backend/app/services/audit.py           审计载荷脱敏与审计写入
#   backend/app/services/notifications.py   Webhook URL 脱敏、渠道分派与投递原因码
# 扩面时：把新模块的守护用例补进 testpaths（越直接的越靠前），同步改
# setup.cfg 的 paths_to_mutate，然后删除 .mutmut-cache 重跑——mutmut 2.x 的
# 结果缓存只按测试文件内容取 hash，只改 runner / 范围不会让旧结果失效。

[pytest]
# -x                               首个失败即停：变异体一旦被杀死就不再跑剩余用例
# --assert=plain                    关闭 pytest 断言改写，避免重写缓存干扰逐个改写源码
# -p no:cacheprovider               不写 .pytest_cache（夜跑 / CI 无人提交该目录）
# --continue-on-collection-errors   关键：被变异模块在 import 期崩溃时 pytest 默认
#                                  退出码是 2，而 mutmut 2.x 只把退出码 1 当作
#                                  「测试失败」，其余一律记成存活；加上该选项后
#                                  收集错误按失败计数（退出码 1），这类变异体才算被杀死
# -q                               精简输出
addopts = -x -q --assert=plain -p no:cacheprovider --continue-on-collection-errors
testpaths =
    backend/tests/test_notification_redaction.py
    backend/tests/test_audit_context.py
    backend/tests/test_reminder_service_unit.py
    backend/tests/test_audit_list_filter.py
    backend/tests/test_reminder_scan_route.py
    backend/tests/test_certificate_guardrails.py
    backend/tests/test_calendar_months.py
    backend/tests/test_recognition_service.py
    backend/tests/test_recognize_async.py
    backend/tests/test_dify.py
    backend/tests/test_storage.py
    backend/tests/test_documents.py
    backend/tests/test_reports.py
    backend/tests/test_dashboard.py
    backend/tests/test_me.py
    backend/tests/test_health.py
    backend/tests/test_internal_health.py
    backend/tests/test_celery_settings.py
    backend/tests/test_auto_create_tables_guard.py
    backend/tests/test_route_pep_contract.py
    backend/tests/test_certificate_expiry_status.py
    backend/tests/test_reminder_workflows.py
    backend/tests/test_data_operations.py
    backend/tests/test_certificate_trace.py
    backend/tests/test_document_trace.py
    backend/tests/test_master_data_trace.py
    backend/tests/test_review_trace.py
